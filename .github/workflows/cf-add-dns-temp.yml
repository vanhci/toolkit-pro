name: cf-add-dns-temp
on:
  push:
    branches: [main]
jobs:
  add-dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add DNS record
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          # 0. 验证 token
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CF_TOKEN" | head -c 400
          echo ""
          # 1. 获取 zone id（打印完整响应）
          RESP=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=vanhci.top" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "ZONE_RESP=$RESP" | head -c 600
          ZONE_ID=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else 'NO_ZONE')")
          echo "ZONE_ID=$ZONE_ID"
          # 2. 检查是否已存在
          EXIST=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=ha.vanhci.top" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "$EXIST" | head -c 300
          # 3. 创建 CNAME 记录
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"type":"CNAME","name":"ha","content":"c73cf930-268c-4e5f-ab04-cadac719f97e.cfargotunnel.com","ttl":1,"proxied":true}'
          echo ""
          echo "DONE"
